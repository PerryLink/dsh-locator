<text x="44" y="588" fill="#a8b1c4" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Source Han Sans SC',sans-serif" font-size="11.5">config: roots · excludes · includeCaches · contentMaxTotalBytes · contentRefreshMs · memoryLimitMB · watchMaxDirs · resourcePreset</text>
<text x="44" y="610" fill="#737b8d" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Source Han Sans SC',sans-serif" font-size="11.5">measured on this WSL2 machine: 480 k entries / 1.4 s cold scan / 35 MB snapshot / ~335 MB RSS; 512 tests at 0.20.2.</text>
