<text x="44" y="444" fill="#737b8d" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Source Han Sans SC',sans-serif" font-size="11">Two indexes: the Go engine owns the 35 MB name snapshot;</text>
<text x="44" y="464" fill="#737b8d" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Source Han Sans SC',sans-serif" font-size="11">host-side SQLite FTS5 owns file bodies and DSH session messages.</text>
<text x="44" y="484" fill="#737b8d" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Source Han Sans SC',sans-serif" font-size="11">Every hit is read-only: a session hit carries sessionId/messageId.</text>
