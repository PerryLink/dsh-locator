<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 380" width="980" height="380" role="img" aria-label="dsh-locator architecture">
  <style>
    .box{fill:#fff;stroke:#c9d1d9;stroke-width:1.5;rx:10}
    .accent{fill:#eef4ff;stroke:#4f7cff}
    .title{font:600 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#1f2328}
    .body{font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#57606a}
    .mono{font:11px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#57606a}
    .arrow{stroke:#8c959f;stroke-width:1.6;fill:none;marker-end:url(#a)}
    .label{font:11px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#8c959f}
    .chip{fill:#f6f8fa;stroke:#d0d7de;stroke-width:1}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8c959f"/>
    </marker>
  </defs>

  <text class="title" x="24" y="32">dsh-locator — self-built index, no Everything</text>

  <!-- filesystem -->
  <rect class="box" x="24" y="58" width="190" height="150"/>
  <text class="title" x="42" y="86">Filesystems</text>
  <rect class="chip" x="42" y="102" width="154" height="26" rx="6"/><text class="body" x="54" y="119">Linux · inotify</text>
  <rect class="chip" x="42" y="136" width="154" height="26" rx="6"/><text class="body" x="54" y="153">macOS · FSEvents</text>
  <rect class="chip" x="42" y="170" width="154" height="26" rx="6"/><text class="body" x="54" y="187">Windows · USN/MFT</text>

  <!-- ingest -->
  <rect class="accent" x="258" y="58" width="220" height="150"/>
  <text class="title" x="276" y="86">Scan &amp; watch</text>
  <text class="body" x="276" y="112">parallel walker (16 workers)</text>
  <text class="body" x="276" y="134">MFT enumeration + journal reader</text>
  <text class="body" x="276" y="156">native change watchers</text>
  <text class="mono" x="276" y="184">fallback: rebuild / refresh</text>

  <!-- snapshot -->
  <rect class="box" x="522" y="58" width="196" height="150"/>
  <text class="title" x="540" y="86">Compact snapshot</text>
  <text class="body" x="540" y="112">40 B records · shared name arena</text>
  <text class="body" x="540" y="134">open-addressed path table</text>
  <text class="body" x="540" y="156">atomic save · mmap-friendly load</text>
  <text class="mono" x="540" y="184">usn-state.json → journal cursor</text>

  <!-- query -->
  <rect class="box" x="762" y="58" width="190" height="150"/>
  <text class="title" x="780" y="86">Query engine</text>
  <text class="body" x="780" y="112">parse Everything-style terms</text>
  <text class="body" x="780" y="134">parallel match · bounded top-K</text>
  <text class="body" x="780" y="156">25–35 ms over 1.2 M entries</text>

  <path class="arrow" d="M214 133H250"/>
  <path class="arrow" d="M478 133H514"/>
  <path class="arrow" d="M718 133H754"/>

  <!-- consumers -->
  <rect class="box" x="258" y="254" width="300" height="88"/>
  <text class="title" x="276" y="282">Agent tools (host side)</text>
  <text class="mono" x="276" y="306">locator_search · locator_status</text>
  <text class="mono" x="276" y="326">locator_rebuild · locator_export</text>

  <rect class="box" x="590" y="254" width="362" height="88"/>
  <text class="title" x="608" y="282">Web panel · Ctrl+Shift+F</text>
  <text class="mono" x="608" y="306">POST /dsh-locator/search · status</text>
  <text class="mono" x="608" y="326">reveal · open · sort · filters · @file</text>

  <path class="arrow" d="M600 208V246"/>
  <path class="arrow" d="M700 208V246"/>
  <text class="label" x="610" y="232">same snapshot, no second server</text>
</svg>
