  <text x="776" y="371" font-size="14" font-weight="700" fill="#c6bcff">locator_read</text>
  <text x="1000" y="371" font-size="13" fill="#b6b2d4">refs · excerpt · quote</text>
  <rect x="762" y="388" width="592" height="28" rx="8" fill="#2b2750"/>
  <text x="776" y="407" font-size="14" font-weight="700" fill="#c6bcff">locator_status</text>
  <text x="1000" y="407" font-size="13" fill="#b6b2d4">brief · full</text>
  <rect x="762" y="424" width="592" height="28" rx="8" fill="#2b2750"/>
  <text x="776" y="443" font-size="14" font-weight="700" fill="#c6bcff">locator_admin</text>
  <text x="1000" y="443" font-size="13" fill="#b6b2d4">deferred · maintenance</text>
  <rect x="762" y="466" width="120" height="2" fill="url(#accent)"/>
</g>
