name: usn-probe

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/usn-probe.yml'

jobs:
  windows-usn:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false
      - name: Build engine
        run: go build -o indexd.exe ./cmd/indexd
      - name: Engine version
        run: .\indexd.exe version
      - name: USN probe (journal + MFT enumeration)
        run: '.\indexd.exe usn-probe --volume C: --root C:\Windows --limit 5 --journal 5'
      - name: USN probe (JSON)
        run: '.\indexd.exe usn-probe --volume C: --root C:\Windows --enumerate=false --json'
      - name: USN scan on C:\Windows
        shell: pwsh
        run: |
          $state = Join-Path $env:RUNNER_TEMP 'usn-winstate'
          .\indexd.exe scan --usn --state $state --root 'C:\Windows'
          .\indexd.exe status --state $state
          .\indexd.exe query --state $state --limit 3 --sort size --desc '.exe'
      - name: USN resume after downtime
        shell: pwsh
        run: |
          $root = 'C:\Windows\Temp\dsh-usn-resume'
          $state = Join-Path $env:RUNNER_TEMP 'usn-resume-state'
          if (Test-Path $root) { Remove-Item -Recurse -Force $root }
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Set-Content -Path (Join-Path $root 'before.txt') -Value 'x'
          .\indexd.exe scan --usn --state $state --root $root
          if (-not (Test-Path (Join-Path $state 'usn-state.json'))) { throw 'scan did not persist usn-state.json' }
          # Created while the engine is stopped; only the journal can know.
          Set-Content -Path (Join-Path $root 'during.txt') -Value 'x'
          $request = '{"id":1,"method":"search","params":{"query":"during","limit":5}}'
          $out = $request | .\indexd.exe serve --usn --state $state --root $root 2>&1
          $out | Select-String 'during.txt'
          if (-not ($out -match 'during\.txt')) { throw 'resume did not see during.txt' }
      - name: Portable fallback on a volume without a journal
        shell: pwsh
        run: |
          $tree = Join-Path $env:RUNNER_TEMP 'usn-tree'
          $state = Join-Path $env:RUNNER_TEMP 'usn-state'
          New-Item -ItemType Directory -Force -Path (Join-Path $tree 'docs') | Out-Null
          Set-Content -Path (Join-Path $tree 'docs\report.pdf') -Value 'x'
          .\indexd.exe scan --usn --state $state --root $tree
          .\indexd.exe query --state $state --limit 5 report
