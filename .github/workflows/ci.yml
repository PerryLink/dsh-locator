name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm build:engine:all
      - run: node scripts/verify.mjs

  go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...

  cross:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build ./...
      - run: GOOS=windows GOARCH=arm64 CGO_ENABLED=0 go build ./...
      - run: GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build ./...
      - run: GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build ./...
      - run: GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build ./...
