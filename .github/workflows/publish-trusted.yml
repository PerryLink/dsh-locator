name: publish-trusted

# One-off OIDC attempt for 0.23.0: publish the tagged tarball without NPM_TOKEN.
# npm trusted publishing must be configured for this repo/workflow on npmjs.com;
# otherwise npm rejects the publish and this workflow is inert.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: npm version
        run: npm --version
      - name: Publish via OIDC (no token)
        run: npm publish --provenance --access public --registry=https://registry.npmjs.org